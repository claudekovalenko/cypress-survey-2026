name: Deploy signup app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert the Airtable token
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN || vars.AIRTABLE_TOKEN }}
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::error::AIRTABLE_TOKEN is empty, so every visitor would be asked to paste a token."
            echo "::error::Add it as a *repository* secret: Settings -> Secrets and variables -> Actions -> Repository secrets."
            echo "::error::An *environment* secret on github-pages will NOT work here - this build job is not scoped to that environment."
            exit 1
          fi
          sed -i "s|PASTE_YOUR_AIRTABLE_TOKEN_HERE|$AIRTABLE_TOKEN|" index.html
          if grep -q PASTE_YOUR_AIRTABLE_TOKEN_HERE index.html; then
            echo "::error::The placeholder is still in index.html after substitution."
            exit 1
          fi
          echo "Token inserted; placeholder is gone."

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
